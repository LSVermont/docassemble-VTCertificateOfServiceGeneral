---
include:
  - docassemble.AssemblyLine:assembly_line.yml
  - docassemble.VTSharedYMLFile:VTSharedYMLFile.yml
  - review.yml
---
metadata:
  title: Certificate of Service - General
  short title: Certificate of Service - General
  description: >-
    Fill out a Certificate of Service form in Vermont. Based on paper version of Vermont Judiciary Form 600-00264 (1/2026).
  original_form:
    - https://www.vermontjudiciary.org/media/11
---
objects:
  - service_recipients: DAList.using(object_type=DAObject, minimum_number=1, complete_attribute='complete')
  - other_documents_served: DAList.using(object_type=DAObject, ask_number=False, minimum_number=1, complete_attribute='complete')
---
code: |
  user_ask_role = user_role
  if user_role == "plaintiff":
    other_parties_role = "defendant"
    other_parties_role_plural = "defendants"
  else:
    other_parties_role = "plaintiff"
    other_parties_role_plural = "plaintiffs"
---
depends on:
  - user_role
  - users.gathered
  - other_parties.gathered
code: |
    certificate_caption_plaintiff = comma_and_list(users) if user_role == "plaintiff" else comma_and_list(other_parties)
    certificate_caption_defendant = comma_and_list(users) if user_role == "defendant" else comma_and_list(other_parties)
---
##################### INTERVIEW ORDER #####################
id: interview order general certificate of service
code: |
  users[0].complete
  user_role
  users.gather()
  other_parties.gather()

  court_division
  if division_requires_county:
    user_selected_county
  trial_court_index
  docket_number

  documents_served
  if documents_served['Other']:
    other_documents_served.gather()
  else:
    other_documents_served.there_are_any = False
  document_served_list

  service_recipients.gather()

  certificate_caption_plaintiff
  certificate_caption_defendant
  certificate_court_division

  # Store anonymous data for analytics / statistics
  store_variables_snapshot(
      persistent=True,
      data={
          "division_where_filing": showifdef("trial_court.division"),  
          "county_where_filing": showifdef("trial_court.address.county"),          
          "reached_interview_end": True,
          "number_of_forms": len(al_user_bundle.enabled_documents()),
          "1st_OP_is_person_or_business": showifdef("other_parties[0].person_type"),
      },
  )
  
  certificate_caption_plaintiff
  certificate_caption_defendant
  certificate_court_division
  trial_court.address.county

  interview_order_general_certificate_of_service = True
---
event: intro_screen
question: |
  Fill out a Certificate of Service form in Vermont
subquestion: |
  ${ intro_vtcourtforms_3_steps }

  <i class="fas fa-file-text fa-2x"></i> This tool helps you fill out a Certificate of Service form for the court. It is used to show the court that you have sent court papers and other documents to the other party or parties in your court case.

  <i class="fas fa-clock fa-2x"></i> It may take you 10 minutes to complete this.

  <i class="fas fa-circle-info fa-2x"></i> It is free to use this program. This site is not a lawyer.

  ${ intro_vtcourtforms_created_by }
continue button field: intro_screen
---
id: important_notes_to_user
question: |
  Important
subquestion: |  
  "Serving" papers means sending or delivering a copy of the papers you file with the court to the other party or parties in the case.

  Be sure to find out what kind of "service" is required for your kind of court case. See the [VTLawHelp.org](https://vtlawhelp.org) or [Vermont Judiciary](https://www.vtcourts.gov/) website for more information. For example, follow this link for [information on how to serve documents in Family Division cases.](https://www.vtcourts.gov/family/divorce/serving-papers)

  For this tool, you will need the mailing address, physical address or email address of the other party/parties. Usually you need to send a copy of your documents to each person or business listed on your court papers -- or to the lawyer representing them.

  <h4>About this tool</h4>

  ${ intro_how_to_edit_answers }

  <h4>Our terms of use</h4>

fields:
  - To continue, please accept our [terms of use](https://vtlawhelp.org/vtcourtforms/terms-of-use).: acknowledged_information_use
    datatype: checkboxes
    none of the above: False    
    minlength: 1
    choices:
      - I accept the terms of use.
    validation messages:
      minlength: |
        You cannot continue unless you agree to the terms of use.
continue button field: important_notes_to_user
---
id: your name
sets:
  - users[i].name.first
  - users[i].name.middle
  - users[i].name.last
  - users[i].name.suffix
question: |
  % if i == 0:
  What is your name?
  % else:
  What is the name of the ${ ordinal(i) } ${ user_role }?
  % endif
subquestion: |
  % if i > 0:
  Enter the name as it appears on the court papers.
  % endif
fields:
  - code: |
      users[i].name_fields()
---
id: your role
question: |
  What is your role in the case?
fields:
  - I am the: user_role
    input type: radio
    choices:
      - Plaintiff: plaintiff
      - Defendant: defendant
---
id: any other users
question: |
  Are there any other ${ user_role }s named in the case?
subquestion: |
  Tip: Look at your court papers. They will list the plaintiffs and defendants.
yesno: users.there_is_another
---
code: |
  users[i].name.first
  users[i].complete = True
---
id: other party name
sets:
  - other_parties[i].name.first
  - other_parties[i].name.middle
  - other_parties[i].name.last
  - other_parties[i].name.suffix
question: |
  % if i == 0:
  What is the ${ other_parties_role }'s name?
  % else:
  What is the name of the ${ ordinal(i) } ${ other_parties_role }?
  % endif
subquestion: |
  A ${ other_parties_role } may be a person, business or organization. Enter the name as it appears on the court papers.

  % if i == 0:
  If there is more than one ${ other_parties_role }, we'll collect their names one at a time. Enter the first name listed on the court papers.
  % endif
fields:
  - code: |
      other_parties[i].name_fields(person_or_business='unsure')
---
id: any other other parties
question: |
  Are there any other ${ other_parties_role_plural } named in the case?
yesno: other_parties.there_is_another
---
code: |
  other_parties[i].name.first
  other_parties[i].complete = True
---
id: court division
question: |
  What division is your court case in?
subquestion: |
  The court division is usually listed at the top of your court papers.
fields:
  - Division: court_division
    input type: radio
    choices:
      - Civil: Civil
      - Family: Family
      - Probate: Probate
      - Criminal: Criminal
      - Environmental: Environmental
      - Judicial Bureau: Judicial Bureau
---
depends on:
  - court_division
code: |
  division_requires_county = court_division not in ["Environmental", "Judicial Bureau"]
---
depends on:
  - court_division
id: court county
question: |
  What county is your court case in?
subquestion: |
  Choose the county where your court case is filed or will be filed.
fields:
  - County: user_selected_county
    code: |
      sorted(
        set(
          row["branch"]
          for index, row in all_courts._load_courts().iterrows()
          if row["division"].replace(" Division", "") == court_division
          and row["branch"] not in ["Environmental", "Judicial Bureau"]
        )
      )
---
depends on:
  - court_division
code: |
  certificate_court_division = court_division.replace(" Division", "")
---
depends on:
  - court_division
  - division_requires_county
  - user_selected_county
code: |
  matching_court_indices = [
    index
    for index, row in all_courts._load_courts().iterrows()
    if (
      (
        not division_requires_county
        and row["branch"] == court_division
      )
      or
      (
        division_requires_county
        and row["division"].replace(" Division", "") == court_division
        and row["branch"] == user_selected_county
      )
    )
  ]

  if len(matching_court_indices) == 1:
    trial_court_index = matching_court_indices[0]
  elif len(matching_court_indices) == 0:
    validation_error("No court matched the division and county you selected.")
  else:
    trial_court_index = matching_court_indices[0]
---
id: case number
question: |
  What is the case number?
subquestion: |
  If you have papers from the court, find the case number. It's usually in the upper-right corner.

  It will look like one of these examples: 26-DM-00000 or 1234-00-00 Cndm.

  Leave this blank if you do not know your case number or don't have a case number yet.
fields:
  - Case number: docket_number
    required: False
---
depends on:
  - trial_court_index
code: |
  trial_court = all_courts.as_court("trial_court", trial_court_index)
---
id: documents served
question: |
  What documents will you serve?
subquestion: |
  Select every document that you will deliver to the other party or parties.

  % if defined("certificate_of_service_prechecked_documents"):
  We preselected documents based on the forms you are creating in this interview. You can change these selections or add other documents.
  % else:
  We have listed common court documents, but you can choose **Other** and enter the name of another kind of document.
  % endif
fields:
  - no label: documents_served
    datatype: checkboxes
    none of the above: False
    default:
      code: |
        certificate_of_service_prechecked_documents if defined("certificate_of_service_prechecked_documents") else []
    choices:
      - Notice of Appearance
      - Summons
      - Complaint
      - Affidavit
      - Answer
      - Counterclaim
      - Exhibits
      - Motion to Dismiss
      - Motion for Default Judgment
      - Application to Waive Filing Fees and Service Costs
      - Notice of Court Decision of Application to Waive Fees and Costs
      - Disclosure of Exempt Income
      - Financial Disclosure Affidavit
      - Motion for Financial Disclosure
      - Financial Disclosure Order
      - Financial Affidavit Form 813A
      - Financial Affidavit Form 813B
      - Default Judgment
      - Notice of Hearing
      - Notice of Appeal
      - Notice of Action and Request for Waiver of Service of Summons
      - Information and Instructions for the Defendant
      - Blank Notice of Appearance form for other party
      - Blank Answer form for other party
      - Blank Certificate of Service form for other party
      - Other
validation code: |
  if len(documents_served.true_values()) == 0:
    validation_error("Select at least one document.")
---
id: other documents served
question: |
  What other document did you serve?
fields:
  - Other document: other_documents_served[i].name
    maxlength: 120
---
code: |
  other_documents_served[i].name
  other_documents_served[i].complete = True
---
id: any other other documents served
question: |
  Did you serve another document that was not listed?
subquestion: |
  You told us about these "other" documents:

  % for other_document in other_documents_served:
    - ${ other_document.name }
  % endfor

  Do you have another document that was not listed?
yesno: other_documents_served.there_is_another
---
depends on:
  - documents_served
  - other_documents_served.gathered
code: |
  document_served_list = documents_served.true_values()
  if documents_served['Other']:
    document_served_list.remove('Other')
    document_served_list.extend([document.name for document in other_documents_served])
---
id: service recipient details
question: |
  Who did you serve?
subquestion: |
  Usually you need to send a copy of your documents to each person or business listed on your court papers -- or to the lawyer representing them.

  If you sent or delivered documents to more than one person, we'll collect that information one at a time.
fields:
  - Name of person, lawyer or business you sent the documents to: service_recipients[i].selected_name
    input type: radio
    code: |
      [str(party) for party in other_parties] + ["Someone else"]
  - Name: service_recipients[i].new_name
    show if:
      variable: service_recipients[i].selected_name
      is: Someone else
---
depends on:
  - service_recipients[i].selected_name
  - service_recipients[i].new_name
code: |
  if service_recipients[i].selected_name == "Someone else":
    service_recipients[i].name = service_recipients[i].new_name
  else:
    service_recipients[i].name = service_recipients[i].selected_name
---
id: service recipient method
question: |
  How did you serve ${ service_recipients[i].name }?
fields:
  - By first class mail: service_recipients[i].first_class_mail
    datatype: yesno
  - By hand delivery: service_recipients[i].personal_delivery
    datatype: yesno
  - By email: service_recipients[i].by_email
    datatype: yesno
    help: The other party must have consented to receive documents by email.
  - By certified mail: service_recipients[i].certified_mail
    datatype: yesno
    help: You will include the return receipt with this form.
  - Other way: service_recipients[i].other_delivery
    datatype: yesno
  - Explain the other way you served them: service_recipients[i].describe_other_delivery
    show if: service_recipients[i].other_delivery
    required: False
  - Mailing address used (enter in one line): service_recipients[i].mailing_service_address
    datatype: text
    required: False
    js show if: |
      val("service_recipients[i].first_class_mail") ||
      val("service_recipients[i].certified_mail")
  - Physical address used (enter in one line): service_recipients[i].physical_service_address
    datatype: text
    required: False
    js show if: |
      val("service_recipients[i].personal_delivery")
  - "Address used for other service method, if any (enter in one line)": service_recipients[i].other_service_address
    datatype: text
    required: False
    js show if: |
      val("service_recipients[i].other_delivery")
  - Email address used: service_recipients[i].service_email
    datatype: email
    required: False
    show if: service_recipients[i].by_email

validation code: |
  if not (
    service_recipients[i].first_class_mail
    or service_recipients[i].personal_delivery
    or service_recipients[i].by_email
    or service_recipients[i].certified_mail
    or service_recipients[i].other_delivery
  ):
    validation_error("Select at least one way you served this person or party.")

  if (
    service_recipients[i].first_class_mail
    or service_recipients[i].certified_mail
  ) and not showifdef("service_recipients[i].mailing_service_address").strip():
    validation_error("Enter the mailing address you used.", field="service_recipients[i].mailing_service_address")

  if service_recipients[i].personal_delivery and not showifdef("service_recipients[i].physical_service_address").strip():
    validation_error("Enter the physical address you used.", field="service_recipients[i].physical_service_address")

  if service_recipients[i].by_email and not showifdef("service_recipients[i].service_email").strip():
    validation_error("Enter the email address you used.", field="service_recipients[i].service_email")

  if service_recipients[i].other_delivery and not showifdef("service_recipients[i].describe_other_delivery").strip():
    validation_error("Explain the other way you served them.", field="service_recipients[i].describe_other_delivery")
---
code: |
  if service_recipients[i].selected_name == "Someone else":
    service_recipients[i].name = service_recipients[i].new_name
  else:
    service_recipients[i].name = service_recipients[i].selected_name

  service_recipients[i].name
  service_recipients[i].first_class_mail
  service_recipients[i].personal_delivery
  service_recipients[i].by_email
  service_recipients[i].certified_mail
  service_recipients[i].other_delivery

  if service_recipients[i].by_email:
    service_recipients[i].service_email

  if service_recipients[i].first_class_mail or service_recipients[i].certified_mail:
    service_recipients[i].mailing_service_address

  if service_recipients[i].personal_delivery:
    service_recipients[i].physical_service_address

  if service_recipients[i].other_delivery:
    service_recipients[i].describe_other_delivery

  service_recipients[i].service_address

  service_method_labels = []
  if service_recipients[i].first_class_mail:
    service_method_labels.append("By first class mail")
  if service_recipients[i].personal_delivery:
    service_method_labels.append("By hand delivery")
  if service_recipients[i].by_email:
    service_method_labels.append("By email")
  if service_recipients[i].certified_mail:
    service_method_labels.append("By certified mail")
  if service_recipients[i].other_delivery:
    service_method_labels.append("Other way: " + service_recipients[i].describe_other_delivery)
  service_recipients[i].service_methods = ", ".join(service_method_labels)

  service_recipients[i].complete = True
---
depends on:
  - service_recipients[i].first_class_mail
  - service_recipients[i].personal_delivery
  - service_recipients[i].by_email
  - service_recipients[i].certified_mail
  - service_recipients[i].other_delivery
  - service_recipients[i].mailing_service_address
  - service_recipients[i].physical_service_address
  - service_recipients[i].service_email
  - service_recipients[i].other_service_address
code: |
  service_address_parts = []
  addendum_service_address_parts = []

  # By first class mail
  if (
    service_recipients[i].first_class_mail
    and showifdef("service_recipients[i].mailing_service_address").strip()
  ):
    mailing_address = service_recipients[i].mailing_service_address.strip()
    service_address_parts.append(mailing_address)
    addendum_service_address_parts.append(mailing_address)

  # By hand delivery
  if (
    service_recipients[i].personal_delivery
    and showifdef("service_recipients[i].physical_service_address").strip()
  ):
    physical_address = service_recipients[i].physical_service_address.strip()
    service_address_parts.append(physical_address)
    addendum_service_address_parts.append(physical_address)

  # By email
  if (
    service_recipients[i].by_email
    and showifdef("service_recipients[i].service_email").strip()
  ):
    addendum_service_address_parts.append(
      service_recipients[i].service_email.strip()
    )

  # By certified mail
  if (
    service_recipients[i].certified_mail
    and showifdef("service_recipients[i].mailing_service_address").strip()
  ):
    mailing_address = service_recipients[i].mailing_service_address.strip()

    if mailing_address not in service_address_parts:
      service_address_parts.append(mailing_address)

    if mailing_address not in addendum_service_address_parts:
      addendum_service_address_parts.append(mailing_address)

  # Other way
  if (
    service_recipients[i].other_delivery
    and showifdef("service_recipients[i].other_service_address").strip()
  ):
    other_address = service_recipients[i].other_service_address.strip()
    service_address_parts.append(other_address)
    addendum_service_address_parts.append(other_address)

  service_recipients[i].service_address = "; ".join(service_address_parts)

  service_recipients[i].addendum_service_addresses = ", ".join(
    addendum_service_address_parts
  )
---
id: any other service recipients
question: |
  Did you serve anyone else?
yesno: service_recipients.there_is_another
---
##################### ATTACHMENTS #####################
---
objects:
  - certificate_of_service_attachment: ALDocument.using(title="Certificate of Service", filename="Certificate of Service.pdf", enabled=True, has_addendum=True)
---
attachment:
  variable name: certificate_of_service_attachment.addendum
  docx template file: certificate_of_service_addendum.docx
---
code: |
  certificate_of_service_attachment.overflow_fields['document_served_list'].overflow_trigger = 6

  certificate_of_service_attachment.overflow_fields['service_recipients'].overflow_trigger = 3

  certificate_of_service_attachment.overflow_fields.gathered = True
---
attachment:
  name: Certificate of Service
  filename: certificate_of_service
  variable name: certificate_of_service_attachment[i]
  pdf template file: general_certificate_of_service_600_00264.pdf
  editable: False
  skip undefined: True
  fields:
    - cos_trial_court_county: ${ user_selected_county if division_requires_county else "" }
    - cos_trial_court_division: ${ certificate_court_division.upper() }
    - cos_docket_number: ${ docket_number }
    - cos_plaintiff: ${ comma_and_list(users) if user_role == "plaintiff" else comma_and_list(other_parties) }
    - cos_defendant: ${ comma_and_list(users) if user_role == "defendant" else comma_and_list(other_parties) }
    - document_served1: ${ document_served_list[0] if len(document_served_list) > 0 else "" }
    - document_served2: ${ document_served_list[1] if len(document_served_list) > 1 else "" }
    - document_served3: ${ document_served_list[2] if len(document_served_list) > 2 else "" }
    - document_served4: ${ document_served_list[3] if len(document_served_list) > 3 else "" }
    - document_served5: ${ document_served_list[4] if len(document_served_list) > 4 else "" }
    - document_served6: ${ document_served_list[5] if len(document_served_list) > 5 else "" }
    - people_receiving_service1: ${ service_recipients[0].name if len(service_recipients) > 0 else '' }
    - first_class_mail1: ${ service_recipients[0].first_class_mail if len(service_recipients) > 0 else False }
    - personal_delivery1: ${ service_recipients[0].personal_delivery if len(service_recipients) > 0 else False }
    - by_email1: ${ service_recipients[0].by_email if len(service_recipients) > 0 else False }
    - other_delivery1: ${ service_recipients[0].other_delivery if len(service_recipients) > 0 else False }
    - certified_mail1: ${ service_recipients[0].certified_mail if len(service_recipients) > 0 else False }
    - describe_other_delivery1: ${ showifdef('service_recipients[0].describe_other_delivery') if len(service_recipients) > 0 and service_recipients[0].other_delivery else '' }
    - service_address1: ${ showifdef('service_recipients[0].service_address') if len(service_recipients) > 0 else '' }
    - service_email1: ${ showifdef('service_recipients[0].service_email') if len(service_recipients) > 0 and service_recipients[0].by_email else '' }
    - people_receiving_service2: ${ service_recipients[1].name if len(service_recipients) > 1 else '' }
    - first_class_mail2: ${ service_recipients[1].first_class_mail if len(service_recipients) > 1 else False }
    - personal_delivery2: ${ service_recipients[1].personal_delivery if len(service_recipients) > 1 else False }
    - by_email2: ${ service_recipients[1].by_email if len(service_recipients) > 1 else False }
    - other_delivery2: ${ service_recipients[1].other_delivery if len(service_recipients) > 1 else False }
    - certified_mail2: ${ service_recipients[1].certified_mail if len(service_recipients) > 1 else False }
    - describe_other_delivery2: ${ showifdef('service_recipients[1].describe_other_delivery') if len(service_recipients) > 1 and service_recipients[1].other_delivery else '' }
    - service_address2: ${ showifdef('service_recipients[1].service_address') if len(service_recipients) > 1 else '' }
    - service_email2: ${ showifdef('service_recipients[1].service_email') if len(service_recipients) > 1 and service_recipients[1].by_email else '' }
    - people_receiving_service3: ${ service_recipients[2].name if len(service_recipients) > 2 else '' }
    - first_class_mail3: ${ service_recipients[2].first_class_mail if len(service_recipients) > 2 else False }
    - personal_delivery3: ${ service_recipients[2].personal_delivery if len(service_recipients) > 2 else False }
    - by_email3: ${ service_recipients[2].by_email if len(service_recipients) > 2 else False }
    - other_delivery3: ${ service_recipients[2].other_delivery if len(service_recipients) > 2 else False }
    - certified_mail3: ${ service_recipients[2].certified_mail if len(service_recipients) > 2 else False }
    - describe_other_delivery3: ${ showifdef('service_recipients[2].describe_other_delivery') if len(service_recipients) > 2 and service_recipients[2].other_delivery else '' }
    - service_address3: ${ showifdef('service_recipients[2].service_address') if len(service_recipients) > 2 else '' }
    - service_email3: ${ showifdef('service_recipients[2].service_email') if len(service_recipients) > 2 and service_recipients[2].by_email else '' }
    - cos_signature_date: ${ "" }
    - COS_signature: ${ "" }
    - cos_signer_name: ${ printed_signature }
---